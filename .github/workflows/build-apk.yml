name: Compiler AAB Play Store (Block Neo 9x9)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-playstore:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation des fichiers du jeu
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation de Java 17 (requis pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Capacitor et AdMob
        run: npm install

      - name: Creation du projet Android natif
        run: |
          npx cap add android
          npx cap sync android

      - name: Mise a niveau vers Android API 35 et minSdk 24
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle

      - name: Injection de l'ID AdMob dans AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8827509730643317~2433447329"/>\n    </application>|g' "$MANIFEST"

      - name: Compilation, signature et export du certificat PEM
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          cd ..
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-key.jks -storepass BlockNeo2026! -keypass BlockNeo2026! android/app/build/outputs/bundle/release/app-release.aab blockneo
          cp android/app/build/outputs/bundle/release/app-release.aab app-release.aab
          keytool -export -rfc -keystore release-key.jks -alias blockneo -storepass BlockNeo2026! -file upload_certificate.pem

      - name: Publication du fichier AAB et du certificat PEM
        uses: actions/upload-artifact@v4
        with:
          name: Block-Neo-9x9-PlayStore-AAB
          path: |
            app-release.aab
            upload_certificate.pem
