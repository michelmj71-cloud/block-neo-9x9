name: Compiler AAB Play Store (Block Neo 9x9)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-playstore:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation des fichiers du jeu
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation de Java 17 (requis pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Capacitor et AdMob
        run: npm install

      - name: Creation du projet Android natif
        run: |
          npx cap add android
          npx cap sync android

      - name: Mise a niveau vers Android API 36, minSdk 24 et version 2
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          printf "\nandroid.suppressUnsupportedCompileSdk=36\n" >> android/gradle.properties

      - name: Injection de l'ID AdMob dans AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8827509730643317~2433447329"/>\n    </application>|g' "$MANIFEST"

      - name: Compilation et signature avec la cle officielle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          cd ..
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-key.jks -storepass BlockNeo2026! -keypass BlockNeo2026! android/app/build/outputs/bundle/release/app-release.aab blockneo

      - name: Publication du fichier AAB Play Store (API 36)
        uses: actions/upload-artifact@v4
        with:
          name: Block-Neo-9x9-API36-V2
          path: android/app/build/outputs/bundle/release/app-release.aab
