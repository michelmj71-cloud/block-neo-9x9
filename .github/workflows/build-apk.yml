name: Exporter Certificat PEM

on:
  push:
    branches: [ "main", "master" ]

jobs:
  export-pem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: keytool -exportcert -rfc -keystore release-key.jks -alias blockneo -storepass BlockNeo2026! -file upload_certificate.pem
      - uses: actions/upload-artifact@v4
        with:
          name: Certificat-Google-Play
          path: upload_certificate.pem
