<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Block Neo 9x9</title>
  <style>
    :root {
      --bg-1: #0b1021;
      --bg-2: #151d3b;
      --board-bg: #11172e;
      --cell-empty: #1c2547;
      --cell-border: #26315e;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      touch-action: none;
    }
    .app {
      display: flex; flex-direction: column; justify-content: space-between;
      width: 100%; max-width: 460px; height: 100%; margin: 0 auto;
      padding: env(safe-area-inset-top, 12px) 14px calc(env(safe-area-inset-bottom, 10px) + 56px);
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(255,255,255,0.05);
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
    }
    .score-box { text-align: left; }
    .score-label { font-size: 11px; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.6px; }
    .score-val { font-size: 26px; font-weight: 800; color: #fff; line-height: 1.1; }
    .best-val { font-size: 13px; color: var(--gold); font-weight: 700; }
    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-top: 6px;
    }
    .pill {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    }
    .pill:active { transform: scale(0.96); }
    .board-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1;
      background: var(--board-bg); border-radius: 16px; padding: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
      gap: 4px;
    }
    .cell {
      background: var(--cell-empty); border-radius: 6px;
      border: 1px solid var(--cell-border); transition: background 0.12s, transform 0.12s;
    }
    .cell.subgrid-alt { filter: brightness(1.09); }
    .cell.filled {
      border-color: rgba(255,255,255,0.35);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.25);
    }
    .cell.ghost { opacity: 0.55; border: 1.5px dashed #fff; }
    .cell.will-clear {
      background: var(--gold) !important;
      box-shadow: 0 0 12px var(--gold);
      transform: scale(0.95);
    }
    .controls-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .btn-action {
      flex: 1; padding: 10px; border-radius: 12px; border: none;
      font-weight: 800; font-size: 13px; color: #fff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.35); cursor: pointer;
    }
    .btn-action.bomb-active { background: linear-gradient(135deg, #dc2626, #991b1b); }
    .btn-action.ad-recharge { background: linear-gradient(135deg, #d97706, #b45309); }
    .dock {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      height: 105px; align-items: center;
      background: rgba(255,255,255,0.04); border-radius: 14px; padding: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .piece-slot {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      position: relative; touch-action: none;
    }
    .mini-grid { display: grid; gap: 2px; pointer-events: none; }
    .mini-cell { width: 15px; height: 15px; border-radius: 4px; }
    .drag-floating {
      position: fixed; left: 0; top: 0; pointer-events: none; z-index: 999;
      display: none; gap: 4px; will-change: transform;
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(6, 10, 25, 0.85);
      display: none; align-items: center; justify-content: center; z-index: 2000; padding: 18px;
    }
    .modal-card {
      background: #162044; border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px; padding: 22px; width: 100%; max-width: 380px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: var(--gold); }
    .modal-text { font-size: 15px; line-height: 1.45; margin-bottom: 18px; color: #e2e8f0; }
    .modal-btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 8px;
      color: #fff; background: linear-gradient(135deg, #10b981, #059669);
    }
    .modal-btn.secondary { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="app">
    <div>
      <div class="top-bar">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="scoreVal">0</div>
        </div>
        <div class="score-box" style="text-align:center;">
          <div class="score-label" id="themeName">Nuit Néon</div>
          <div class="best-val" id="nextMilestone">Palier : 5 000</div>
        </div>
        <div class="score-box" style="text-align:right;">
          <div class="score-label">Record</div>
          <div class="score-val" id="bestVal">0</div>
        </div>
      </div>

      <div class="meta-row">
        <div class="pill" id="btnRank">🏆 #<span id="worldRank">999</span></div>
        <div class="pill" id="btnJokes">😄 <span id="jokesCount">0</span>/30</div>
        <div class="pill">❤️ Vies pub : <span id="reviveLeft">3</span>/3</div>
        <div class="pill" id="btnAdMode" title="Mode Test Anti-Ban AdMob actif">🛡️ Mode Test</div>
      </div>
    </div>

    <div class="board-wrap" id="board"></div>

    <div class="controls-row">
      <button class="btn-action" id="btnBomb">💣 Bombe (<span id="bombCount">3</span>/3)</button>
      <button class="btn-action ad-recharge" id="btnBombAd" style="display:none;">📺 +1 Bombe (<span id="bombTimer">05:00</span>)</button>
    </div>

    <div class="dock" id="dock">
      <div class="piece-slot" data-idx="0"></div>
      <div class="piece-slot" data-idx="1"></div>
      <div class="piece-slot" data-idx="2"></div>
    </div>
  </div>

  <div class="drag-floating" id="dragProxy"></div>

  <!-- Modal Palier 5000 + Blague -->
  <div class="modal-backdrop" id="jokeModal">
    <div class="modal-card">
      <div class="modal-title" id="milestoneTitle">🎉 PALIER 5 000 ATTEINT !</div>
      <div class="modal-text" id="jokeText"></div>
      <div style="font-size:13px; color:#38bdf8; margin-bottom:12px;">✨ Nouveau décor débloqué + 💣 1 Bombe offerte !</div>
      <button class="modal-btn" id="closeJokeBtn">Continuer la partie</button>
    </div>
  </div>

  <!-- Modal Fin de partie -->
  <div class="modal-backdrop" id="gameOverModal">
    <div class="modal-card">
      <div class="modal-title">Plus de place !</div>
      <div class="modal-text">Score : <strong id="finalScore">0</strong></div>
      <button class="modal-btn" id="btnReviveAd">📺 Seconde Chance (3/3 restantes)</button>
      <div id="reviveLimitMsg" style="display:none; color:#f87171; font-size:13px; font-weight:700; margin:8px 0;">
        🚫 Limite atteinte (3/3 secondes chances utilisées)
      </div>
      <button class="modal-btn secondary" id="btnRestart">🔄 Nouvelle Partie</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION OFFICIELLE GOOGLE ADMOB (AVEC TES IDENTIFIANTS)
    // =========================================================================
    const ADMOB_CONFIG = {
      appId: "ca-app-pub-8827509730643317~2433447329",
      bannerId: "ca-app-pub-8827509730643317/9625541639",
      interstitialId: "ca-app-pub-8827509730643317/6512293139",
      rewardedId: "ca-app-pub-8827509730643317/2573048121",
      // IMPORTANT : Laisse isTesting sur true tant que tu testes sur ton S25 Ultra !
      // Nous le passerons sur false juste avant l'envoi public sur le Google Play Store.
      isTesting: false
    };

    const AdMobBridge = {
      ready: false,
      plugin: null,
      async init() {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
            this.plugin = window.Capacitor.Plugins.AdMob;
            await this.plugin.initialize({ initializeForTesting: ADMOB_CONFIG.isTesting });
            this.ready = true;
            this.showBanner();
          }
        } catch (e) {
          console.log("Mode navigateur ou AdMob non initialisé :", e);
        }
      },
      async showBanner() {
        if (!this.ready) return;
        try {
          await this.plugin.showBanner({
            adId: ADMOB_CONFIG.bannerId,
            adSize: "ADAPTIVE_BANNER",
            position: "BOTTOM_CENTER",
            margin: 0,
            isTesting: ADMOB_CONFIG.isTesting
          });
        } catch (e) {}
      },
      async showInterstitial() {
        if (!this.ready) return;
        try {
          await this.plugin.prepareInterstitial({
            adId: ADMOB_CONFIG.interstitialId,
            isTesting: ADMOB_CONFIG.isTesting
          });
          await this.plugin.showInterstitial();
        } catch (e) {}
      },
      async showRewarded(onReward) {
        if (!this.ready) {
          onReward();
          return;
        }
        try {
          await this.plugin.prepareRewardVideoAd({
            adId: ADMOB_CONFIG.rewardedId,
            isTesting: ADMOB_CONFIG.isTesting
          });
          await this.plugin.showRewardVideoAd();
          onReward();
        } catch (e) {
          onReward();
        }
      }
    };

    // =========================================================================
    // 30 BLAGUES 100 % FRANÇAISES (SANS DOUBLON)
    // =========================================================================
    const JOKES_FR = [
      "Que dit un citron quand il braque une banque ? « Pas un zeste, je suis pressé ! »",
      "Pourquoi les plongeurs plongent-ils toujours en arrière et jamais en avant ? Parce que sinon ils tombent dans le bateau.",
      "Quel est le comble pour un électricien ? De ne pas être au courant.",
      "Que fait une fraise sur un cheval ? Tagada, Tagada !",
      "Quel est le sport le plus fruité ? La boxe, parce que tu te prends des pêches dans la poire et tu tombes dans les pommes.",
      "Deux grains de sable arrivent à la plage : « Purée, c'est blindé aujourd'hui ! »",
      "Que dit une imprimante dans l'eau ? « J'ai pas papier ! »",
      "Pourquoi les poissons travaillent-ils illégalement ? Parce qu'ils n'ont pas de fiche de paie.",
      "Comment appelle-t-on un chat tombé dans un pot de peinture le jour de Noël ? Un chat-peint de Noël.",
      "Quel est le crustacé le plus léger de la mer ? La palourde.",
      "Comment s'appelle un crocodile quiaccoste un bateau ? Il Lacoste.",
      "Quel est le comble pour un boulanger ? D'être dans le pétrin.",
      "Comment appelle-t-on un chat dans l'espace ? Un chatellite.",
      "Que dit un oignon quand il se cogne ? « Aïe ! »",
      "Quel est l'animal le plus connecté ? Le porc USB.",
      "Pourquoi Napoléon n'a-t-il jamais déménagé ? Parce qu'il avait un Bonaparte.",
      "Que fait un geek quand il a peur ? Il URL.",
      "Quel est le légume le plus courageux ? Le pois chiche.",
      "Comment appelle-t-on un chien sans pattes ? On ne l'appelle pas, on va le chercher.",
      "Pourquoi les oiseaux volent-ils vers le sud en hiver ? Parce que c'est trop long d'y aller à pied.",
      "Que dit un escargot quand il croise une limace ? « Oh, un naturiste ! »",
      "Quel est le comble pour un professeur de géographie ? De perdre le nord.",
      "Pourquoi le football est-il le sport le plus bruyant ? Parce que les joueurs font tout un boucan pour un ballon.",
      "Quel est le fromage préféré de la femme du roquefort ? Le mari-oilles.",
      "Que dit une noisette qui tombe à l'eau ? « Je me noix ! »",
      "Pourquoi les fantômes sont-ils de très mauvais menteurs ? Parce qu'on voit tout de suite à travers eux.",
      "Comment appelle-t-on un ascenseur en Amérique ? En appuyant sur le bouton.",
      "Quel est le comble pour un jardinier ? De raconter des salades.",
      "Que fait une vache avec une radio ? De la meuh-sique.",
      "Pourquoi les maths sont-elles tristes ? Parce qu'elles ont trop de problèmes."
    ];

    const THEMES = [
      { name: "Nuit Néon", bg1: "#0b1021", bg2: "#151d3b", board: "#11172e", cell: "#1c2547" },
      { name: "Forêt Émeraude", bg1: "#062019", bg2: "#0d3b2e", board: "#092c22", cell: "#134e3a" },
      { name: "Galaxie Cosmique", bg1: "#1a0b2e", bg2: "#2d1452", board: "#220e3d", cell: "#3b1c66" },
      { name: "Volcan Solaire", bg1: "#2a0c0c", bg2: "#471515", board: "#361010", cell: "#5c1d1d" },
      { name: "Océan Abyssal", bg1: "#071c2c", bg2: "#0e3552", board: "#0a283d", cell: "#154566" }
    ];

    const SHAPES = [
      { m: [[1]], c: "#38bdf8" },
      { m: [[1,1]], c: "#60a5fa" },
      { m: [[1],[1]], c: "#60a5fa" },
      { m: [[1,1,1]], c: "#34d399" },
      { m: [[1],[1],[1]], c: "#34d399" },
      { m: [[1,1],[1,1]], c: "#fbbf24" },
      { m: [[1,1,1],[1,0,0]], c: "#f472b6" },
      { m: [[1,1,1],[0,0,1]], c: "#f472b6" },
      { m: [[1,1,1],[0,1,0]], c: "#a78bfa" },
      { m: [[1,1,1,1]], c: "#fb7185" },
      { m: [[1],[1],[1],[1]], c: "#fb7185" },
      { m: [[1,1,1],[1,1,1],[1,1,1]], c: "#f97316" }
    ];

    let grid = Array.from({ length: 9 }, () => Array(9).fill(null));
    let dockPieces = [null, null, null];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem("bn9_best") || "0", 10);
    let nextMilestone = 5000;
    let themeIndex = 0;
    let bombs = 3;
    let bombMode = false;
    let bombCooldownEnd = 0;
    let revivesLeft = 3;
    let gameOverCount = 0;
    let jokeDeck = [];
    let unlockedJokes = JSON.parse(localStorage.getItem("bn9_jokes") || "[]");

    const boardEl = document.getElementById("board");
    const cellsEl = [];

    function initBoard() {
      boardEl.innerHTML = "";
      cellsEl.length = 0;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const d = document.createElement("div");
          d.className = "cell";
          if ((Math.floor(r / 3) + Math.floor(c / 3)) % 2 === 1) d.classList.add("subgrid-alt");
          d.addEventListener("click", () => onCellClick(r, c));
          boardEl.appendChild(d);
          cellsEl.push(d);
        }
      }
      document.getElementById("bestVal").textContent = bestScore;
      document.getElementById("jokesCount").textContent = unlockedJokes.length;
      spawnDock();
      renderBoard();
      AdMobBridge.init();
      setInterval(tickBombTimer, 1000);
    }

    function applyTheme(idx) {
      const t = THEMES[idx % THEMES.length];
      document.documentElement.style.setProperty("--bg-1", t.bg1);
      document.documentElement.style.setProperty("--bg-2", t.bg2);
      document.documentElement.style.setProperty("--board-bg", t.board);
      document.documentElement.style.setProperty("--cell-empty", t.cell);
      document.getElementById("themeName").textContent = t.name;
    }

    function drawRandomJoke() {
      if (jokeDeck.length === 0) {
        jokeDeck = JOKES_FR.map((_, i) => i).sort(() => Math.random() - 0.5);
      }
      const idx = jokeDeck.pop();
      if (!unlockedJokes.includes(idx)) {
        unlockedJokes.push(idx);
        localStorage.setItem("bn9_jokes", JSON.stringify(unlockedJokes));
        document.getElementById("jokesCount").textContent = unlockedJokes.length;
      }
      return JOKES_FR[idx];
    }

    function spawnDock() {
      for (let i = 0; i < 3; i++) {
        const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        dockPieces[i] = { m: s.m, c: s.c };
      }
      renderDock();
    }

    function renderDock() {
      document.querySelectorAll(".piece-slot").forEach((slot, i) => {
        slot.innerHTML = "";
        const p = dockPieces[i];
        if (!p) return;
        const g = document.createElement("div");
        g.className = "mini-grid";
        g.style.gridTemplateColumns = `repeat(${p.m[0].length}, 15px)`;
        p.m.forEach(row => {
          row.forEach(v => {
            const mc = document.createElement("div");
            mc.className = "mini-cell";
            if (v) mc.style.background = p.c;
            g.appendChild(mc);
          });
        });
        slot.appendChild(g);
      });
    }

    function renderBoard() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const el = cellsEl[r * 9 + c];
          el.classList.remove("filled", "ghost", "will-clear");
          el.style.background = "";
          if (grid[r][c]) {
            el.classList.add("filled");
            el.style.background = grid[r][c];
          }
        }
      }
    }

    function canPlace(piece, r0, c0) {
      for (let r = 0; r < piece.m.length; r++) {
        for (let c = 0; c < piece.m[0].length; c++) {
          if (!piece.m[r][c]) continue;
          const nr = r0 + r, nc = c0 + c;
          if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9 || grid[nr][nc]) return false;
        }
      }
      return true;
    }

    function placePiece(pieceIdx, r0, c0) {
      const p = dockPieces[pieceIdx];
      let placedCells = 0;
      for (let r = 0; r < p.m.length; r++) {
        for (let c = 0; c < p.m[0].length; c++) {
          if (p.m[r][c]) {
            grid[r0 + r][c0 + c] = p.c;
            placedCells++;
          }
        }
      }
      dockPieces[pieceIdx] = null;
      addScore(placedCells * 10);
      clearLinesAndSubgrids();
      if (dockPieces.every(x => x === null)) spawnDock();
      renderDock();
      renderBoard();
      checkGameOver();
    }

    function clearLinesAndSubgrids() {
      const toClear = new Set();
      for (let r = 0; r < 9; r++) {
        if (grid[r].every(v => v !== null)) for (let c = 0; c < 9; c++) toClear.add(r * 9 + c);
      }
      for (let c = 0; c < 9; c++) {
        let full = true;
        for (let r = 0; r < 9; r++) if (!grid[r][c]) full = false;
        if (full) for (let r = 0; r < 9; r++) toClear.add(r * 9 + c);
      }
      for (let br = 0; br < 3; br++) {
        for (let bc = 0; bc < 3; bc++) {
          let full = true;
          for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++)
              if (!grid[br * 3 + r][bc * 3 + c]) full = false;
          if (full) {
            for (let r = 0; r < 3; r++)
              for (let c = 0; c < 3; c++)
                toClear.add((br * 3 + r) * 9 + (bc * 3 + c));
          }
        }
      }
      if (toClear.size > 0) {
        toClear.forEach(idx => {
          const r = Math.floor(idx / 9), c = idx % 9;
          grid[r][c] = null;
        });
        addScore(toClear.size * 25);
      }
    }

    function addScore(pts) {
      score += pts;
      document.getElementById("scoreVal").textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("bn9_best", String(bestScore));
        document.getElementById("bestVal").textContent = bestScore;
      }
      const rank = Math.max(1, 1000 - Math.floor(bestScore / 45));
      document.getElementById("worldRank").textContent = rank;

      if (score >= nextMilestone) {
        const reached = nextMilestone;
        nextMilestone += 5000;
        document.getElementById("nextMilestone").textContent = "Palier : " + nextMilestone.toLocaleString("fr-FR");
        themeIndex++;
        applyTheme(themeIndex);
        if (bombs < 3) {
          bombs++;
          updateBombUI();
        }
        document.getElementById("milestoneTitle").textContent = `🎉 PALIER ${reached.toLocaleString("fr-FR")} ATTEINT !`;
        document.getElementById("jokeText").textContent = drawRandomJoke();
        document.getElementById("jokeModal").style.display = "flex";
      }
    }

    function checkGameOver() {
      for (let i = 0; i < 3; i++) {
        const p = dockPieces[i];
        if (!p) continue;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (canPlace(p, r, c)) return;
          }
        }
      }
      document.getElementById("finalScore").textContent = score;
      const btnRevive = document.getElementById("btnReviveAd");
      const limitMsg = document.getElementById("reviveLimitMsg");
      if (revivesLeft > 0) {
        btnRevive.style.display = "block";
        btnRevive.textContent = `📺 Seconde Chance (${revivesLeft}/3 restantes)`;
        limitMsg.style.display = "none";
      } else {
        btnRevive.style.display = "none";
        limitMsg.style.display = "block";
      }
      document.getElementById("gameOverModal").style.display = "flex";
    }

    // =========================================================================
    // BOMBES (3 MAX + RECHARGE 5 MINUTES OU PUB VIDEO)
    // =========================================================================
    function updateBombUI() {
      document.getElementById("bombCount").textContent = bombs;
      const btnAd = document.getElementById("btnBombAd");
      if (bombs < 3) {
        if (bombCooldownEnd === 0) bombCooldownEnd = Date.now() + 5 * 60 * 1000;
        btnAd.style.display = "flex";
      } else {
        bombCooldownEnd = 0;
        btnAd.style.display = "none";
      }
    }

    function tickBombTimer() {
      if (bombs >= 3 || bombCooldownEnd === 0) return;
      const rem = Math.max(0, Math.ceil((bombCooldownEnd - Date.now()) / 1000));
      const m = String(Math.floor(rem / 60)).padStart(2, "0");
      const s = String(rem % 60).padStart(2, "0");
      document.getElementById("bombTimer").textContent = `${m}:${s}`;
      if (rem <= 0) {
        bombs++;
        bombCooldownEnd = bombs < 3 ? Date.now() + 5 * 60 * 1000 : 0;
        updateBombUI();
      }
    }

    function onCellClick(r, c) {
      if (!bombMode || bombs <= 0) return;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9) grid[nr][nc] = null;
        }
      }
      bombs--;
      bombMode = false;
      document.getElementById("btnBomb").classList.remove("bomb-active");
      updateBombUI();
      renderBoard();
    }

    document.getElementById("btnBomb").addEventListener("click", () => {
      if (bombs <= 0) return;
      bombMode = !bombMode;
      document.getElementById("btnBomb").classList.toggle("bomb-active", bombMode);
    });

    document.getElementById("btnBombAd").addEventListener("click", () => {
      AdMobBridge.showRewarded(() => {
        if (bombs < 3) bombs++;
        updateBombUI();
      });
    });

    document.getElementById("btnReviveAd").addEventListener("click", () => {
      if (revivesLeft <= 0) return;
      AdMobBridge.showRewarded(() => {
        revivesLeft--;
        document.getElementById("reviveLeft").textContent = revivesLeft;
        for (let r = 2; r <= 6; r++)
          for (let c = 2; c <= 6; c++) grid[r][c] = null;
        spawnDock();
        renderBoard();
        document.getElementById("gameOverModal").style.display = "none";
      });
    });

    document.getElementById("btnRestart").addEventListener("click", async () => {
      gameOverCount++;
      if (gameOverCount % 3 === 0) await AdMobBridge.showInterstitial();
      grid = Array.from({ length: 9 }, () => Array(9).fill(null));
      score = 0;
      nextMilestone = 5000;
      bombs = 3;
      revivesLeft = 3;
      document.getElementById("scoreVal").textContent = "0";
      document.getElementById("reviveLeft").textContent = "3";
      document.getElementById("nextMilestone").textContent = "Palier : 5 000";
      updateBombUI();
      spawnDock();
      renderBoard();
      document.getElementById("gameOverModal").style.display = "none";
    });

    document.getElementById("closeJokeBtn").addEventListener("click", () => {
      document.getElementById("jokeModal").style.display = "none";
    });

    // =========================================================================
    // GLISSER-DEPOSER 120 FPS (OPTIMISÉ POUR SAMSUNG S25 ULTRA)
    // =========================================================================
    let dragIdx = null;
    let targetCell = null;
    const proxy = document.getElementById("dragProxy");

    document.querySelectorAll(".piece-slot").forEach(slot => {
      slot.addEventListener("pointerdown", e => {
        const idx = parseInt(slot.dataset.idx, 10);
        const p = dockPieces[idx];
        if (!p) return;
        dragIdx = idx;
        slot.style.opacity = "0.25";
        const cellRect = cellsEl[0].getBoundingClientRect();
        const sz = cellRect.width;
        proxy.innerHTML = "";
        proxy.style.display = "grid";
        proxy.style.gridTemplateColumns = `repeat(${p.m[0].length}, ${sz}px)`;
        p.m.forEach(row => {
          row.forEach(v => {
            const d = document.createElement("div");
            d.style.width = sz + "px";
            d.style.height = sz + "px";
            d.style.borderRadius = "6px";
            if (v) {
              d.style.background = p.c;
              d.style.boxShadow = "0 6px 16px rgba(0,0,0,0.45)";
            }
            proxy.appendChild(d);
          });
        });
        moveProxy(e.clientX, e.clientY);
      });
    });

    function moveProxy(cx, cy) {
      if (dragIdx === null) return;
      const p = dockPieces[dragIdx];
      const bRect = boardEl.getBoundingClientRect();
      const cellSz = bRect.width / 9;
      const w = p.m[0].length * cellSz;
      const h = p.m.length * cellSz;
      const x = cx - w / 2;
      const y = cy - h - 55;
      proxy.style.transform = `translate3d(${x}px, ${y}px, 0)`;

      const c0 = Math.round((x - bRect.left) / cellSz);
      const r0 = Math.round((y - bRect.top) / cellSz);
      renderBoard();
      if (canPlace(p, r0, c0)) {
        targetCell = { r: r0, c: c0 };
        for (let r = 0; r < p.m.length; r++) {
          for (let c = 0; c < p.m[0].length; c++) {
            if (p.m[r][c]) {
              const el = cellsEl[(r0 + r) * 9 + (c0 + c)];
              el.classList.add("ghost");
              el.style.background = p.c;
            }
          }
        }
      } else {
        targetCell = null;
      }
    }

    window.addEventListener("pointermove", e => {
      if (dragIdx !== null) moveProxy(e.clientX, e.clientY);
    });

    window.addEventListener("pointerup", () => {
      if (dragIdx === null) return;
      document.querySelectorAll(".piece-slot")[dragIdx].style.opacity = "1";
      proxy.style.display = "none";
      if (targetCell) placePiece(dragIdx, targetCell.r, targetCell.c);
      else renderBoard();
      dragIdx = null;
      targetCell = null;
    });

    initBoard();
  </script>
</body>
</html>
